{% include base_path %}
<div class="masthead"><div class="masthead__inner-wrap"><div class="masthead__menu"><nav id="site-nav" class="greedy-nav" aria-label="Main navigation">
<button aria-label="Open navigation"><span class="navicon"></span></button>
<ul class="visible-links"><li class="masthead__menu-item masthead__menu-item--lg persist"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></li>
{% for link in site.data.navigation.main %}<li class="masthead__menu-item {% if page.url == link.url %}selected{% endif %}"><a href="{{ link.url | relative_url }}" data-i18n="{{ link.key }}">{{ link.title }}</a></li>{% endfor %}
<li class="masthead__menu-item persist"><a role="button" tabindex="0" class="language-switch" id="language" aria-label="Switch to Chinese">中文 ↗</a></li>
<li id="theme-toggle" class="masthead__menu-item persist tail"><a role="button" tabindex="0" aria-label="Toggle light or dark theme"><i id="theme-icon" class="fa-solid fa-sun" aria-hidden="true"></i></a></li></ul><ul class="hidden-links hidden"></ul>
</nav></div></div></div>
